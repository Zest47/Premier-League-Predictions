
spring.application.name=user-service

# Port : 8081 en local, PORT sur Render
server.port=${PORT:8081}

# PostgreSQL : valeurs locales par défaut
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/premier_league_predictions}
spring.datasource.username=${DB_USERNAME:plp_user}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${PLP_JWT_SECRET}
