
services:
  postgres:
    image: postgres:16
    container_name: plp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: premier_league_predictions
      POSTGRES_USER: plp_user
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plp_user -d premier_league_predictions"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
