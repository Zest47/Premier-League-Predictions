spring.application.name=prediction-service

server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/premier_league_predictions
spring.datasource.username=plp_user
spring.datasource.password=plp_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# JWT
jwt.secret=${PLP_JWT_SECRET}