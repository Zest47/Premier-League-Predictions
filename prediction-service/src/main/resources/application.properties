
spring.application.name=prediction-service

# Port : 8082 en local, PORT sur Render
server.port=${PORT:8082}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/premier_league_predictions}
spring.datasource.username=${DB_USERNAME:plp_user}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# JWT
jwt.secret=${PLP_JWT_SECRET}
